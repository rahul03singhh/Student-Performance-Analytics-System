<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Performance Analytics</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: #11151d;
            border: 1px solid #292f3a;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .login-box h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .login-box p {
            color: #7d8696;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #858e9e;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #090b10;
            border: 1px solid #252a34;
            border-radius: 7px;
            color: white;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #65ff96;
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            background: #ffffff;
            color: #090b10;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #dfe3e8;
        }
        .error-msg {
            color: #ff6565;
            font-size: 12px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <div class="logo-box" style="margin-bottom: 20px;">SP</div>
            <h2>Portal Sign In</h2>
            <p>Access the Student Performance Analytics dashboard.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>USERNAME</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>

                <div class="form-group">
                    <label>PASSWORD</label>
                    <input type="password" id="password" placeholder="admin123" required>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
                <div class="error-msg" id="loginError">Invalid credentials. Try admin / admin123</div>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
